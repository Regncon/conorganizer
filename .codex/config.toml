[mcp_servers.grafana]
command = "go"
args = [
  "run",
  "github.com/grafana/mcp-grafana/v2/cmd/mcp-grafana@v2.0.2",
  "--disable-write",
  "--usage-stats=disabled",
]
env = { GRAFANA_URL = "https://grafana.regncon.no" }
env_vars = [
  "GRAFANA_SERVICE_ACCOUNT_TOKEN",
  "GOCACHE",
  "GOMODCACHE",
  "GOPATH",
  "GOPROXY",
  "GOFLAGS",
]
startup_timeout_sec = 60
