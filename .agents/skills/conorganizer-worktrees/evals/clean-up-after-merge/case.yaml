schema_version: "1.1"
name: clean-up-after-merge
expected_outcome: |
  Fixture: a worktree .claude/worktrees/jolly-noether-4c1d2e on branch claude/jolly-noether-4c1d2e
  created from main with no commits of its own and no remote branch; the run works from the main
  checkout. The merge state is checked first (and the missing PR reported), then git worktree
