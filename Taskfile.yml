version: "3"

dotenv:
    - ".env"

env:
    STATIC_DIR: "static"

vars:
    # Prettier formats <style> and <script> bodies for templ fmt. CI and
    # setup:prettier install this version, so bump it here only.
    PRETTIER_VERSION: "3.9.10"

tasks:
    # The `build:` tasks below are used together for "production" builds of your project
    build:templ:
        cmds:
            - |
              set -eu
              for dir in components pages layouts service; do
                if [ -d "$dir" ]; then
                  go tool templ generate -path "$dir" -log-level error
                fi
              done

    build:
        cmds:
            - go build -o bin/main .
        deps:
            - build:templ
        #parallel: true

        # Use this task to debug your project with the delve debugger
    debug:
        cmds:
            - go tool dlv exec ./bin/main
        deps:
            - build

    # The `start:` tasks below are used together for "dev" builds, and will hot-reload your entire project when there are code changes
    start:templ:
        cmds:
            - |
              set -eu
              mkdir -p tmp/templ-watch
              lock_dir="tmp/templ-watch/generating.lock"
              rmdir "$lock_dir" 2>/dev/null || true

              hash_templates() {
                find "$1" -type f -name '*.templ' -exec sha256sum {} + 2>/dev/null \
                  | sort \
                  | sha256sum \
                  | cut -d ' ' -f 1
              }

              generate_dirs() {
                generation_mode="$1"
                shift

                if [ "$#" -eq 0 ]; then
                  return
                fi

                while ! mkdir "$lock_dir" 2>/dev/null; do
                  sleep 0.1
                done

                for dir in "$@"; do
                  if [ ! -d "$dir" ]; then
                    continue
                  fi

                  echo "templ: generating $dir"
                  if [ "$generation_mode" = "lazy" ]; then
                    if ! go tool templ generate -path "$dir" -lazy -log-level error; then
                      echo "templ: generation failed for $dir" >&2
                    fi
                  elif ! go tool templ generate -path "$dir" -log-level error; then
                    echo "templ: generation failed for $dir" >&2
                  fi
                  hash_templates "$dir" > "tmp/templ-watch/$dir.sha256"
                done

                rmdir "$lock_dir"
              }

              for dir in components pages layouts service; do
                if [ -d "$dir" ]; then
                  hash_templates "$dir" > "tmp/templ-watch/$dir.sha256"
                fi
              done

              while true; do
                changed_dirs=""
                for dir in components pages layouts service; do
                  if [ ! -d "$dir" ]; then
                    continue
                  fi

                  state="tmp/templ-watch/$dir.sha256"
                  current_hash="$(hash_templates "$dir")"
                  previous_hash="$(cat "$state" 2>/dev/null || true)"

                  if [ "$current_hash" != "$previous_hash" ]; then
                    changed_dirs="$changed_dirs $dir"
                  fi
                done

                if [ -n "$changed_dirs" ]; then
                  generate_dirs lazy $changed_dirs
                fi

                sleep 0.5
              done

    start:server:
        vars:
            APP_DB_PATH: '{{.APP_DB_PATH | default "database/events.db"}}'
            APP_IMAGE_PATH: '{{.APP_IMAGE_PATH | default "local-event-images"}}'
        cmds:
            - |
              set -eu
              app_db_path="{{.APP_DB_PATH}}"
              app_image_path="{{.APP_IMAGE_PATH}}"
              export HOT_RELOAD_BINARY_DIR="${HOT_RELOAD_BINARY_DIR:-tmp/bin}"
              binary_path="$HOT_RELOAD_BINARY_DIR/main"
              build_cmd='set -eu; while [ -d tmp/templ-watch/generating.lock ]; do sleep 0.1; done; mkdir -p "$HOT_RELOAD_BINARY_DIR"; out="$HOT_RELOAD_BINARY_DIR/main.$$"; go build -buildvcs=false -tags dev -ldflags="-s -w" -o "$out" .; mv "$out" "$HOT_RELOAD_BINARY_DIR/main"'

              go tool air \
              --build.cmd "$build_cmd" \
              --build.entrypoint "$binary_path" \
              --build.args_bin "-dbp $app_db_path -image-path $app_image_path" \
              --build.delay "200" \
              --build.exclude_dir ".git,.jj,tmp,vendor,testdata,database,data,hetzner,local-event-images,configuration-as-code,deploy,documentation,migrations,plans,testutil,.gocache" \
              --build.include_ext "go" \
              --build.include_file ".env" \
              --build.poll "true" \
              --build.poll_interval "500" \
              --build.stop_on_error "false" \
              --proxy.enabled "false" \
              --misc.clean_on_exit true

    start:reload:
        cmds:
            - |
              hot_reload_url="http://localhost:${PORT:-8080}/hotreload"
              go tool air \
              --build.cmd "curl -fsS --retry 30 --retry-delay 1 --retry-all-errors --retry-max-time 30 --connect-timeout 2 --max-time 5 $hot_reload_url >/dev/null 2>&1 || true" \
              --build.entrypoint "/bin/true" \
              --build.delay "200" \
              --build.exclude_dir ".git,.jj,tmp,vendor,testdata,database,data,hetzner,local-event-images,configuration-as-code,deploy,documentation,migrations,plans,testutil,.gocache" \
              --build.include_dir "$STATIC_DIR" \
              --build.include_ext "js,css,html,svg,webp,ico,png,jpg,jpeg,avif" \
              --build.poll "true" \
              --build.poll_interval "500" \
              --build.stop_on_error "false" \
              --proxy.enabled "false" \
              --misc.clean_on_exit true

    start:watch:
        vars:
            APP_DB_PATH: '{{.APP_DB_PATH | default "database/events.db"}}'
            APP_IMAGE_PATH: '{{.APP_IMAGE_PATH | default "local-event-images"}}'
        deps:
            - start:templ
            - start:reload
            - task: start:server
              vars:
                  APP_DB_PATH: '{{.APP_DB_PATH}}'
                  APP_IMAGE_PATH: '{{.APP_IMAGE_PATH}}'

    start:
        cmds:
            - task: build:templ
            - task: start:watch

    start:demo:
        cmds:
            - task: build:templ
            - task: start:watch
              vars:
                  APP_DB_PATH: database/events-demo.db

    start:logcolors:
        cmds:
            - |
              go tool task start 2>&1 | sed -E \
              -e 's/(ERROR)/\x1b[31;1m\1\x1b[0m/g' \
              -e 's/(WARN)/\x1b[33;1m\1\x1b[0m/g' \
              -e 's/(DEBUG)/\x1b[32;1m\1\x1b[0m/g'

    # Start development server
    dev:
        cmds:
            - air -c .air.toml

    # Run current build
    run:
        cmds:
            - ./bin/main
        deps:
            - build

    # Format .templ files. <style> and <script> bodies and constant attribute
    # values are only formatted when prettier is on PATH, see documentation/editor-setup.md
    fmt:templ:
        cmds:
            - |
              set -eu
              for dir in components pages layouts service; do
                if [ -d "$dir" ]; then
                  go tool templ fmt -log-level error "$dir"
                fi
              done

    # Fail when a .templ file is not formatted. Requires prettier so the result
    # matches CI. templ writes the formatted files before failing, so the diff
    # shows what to commit.
    check:templ-fmt:
        cmds:
            - |
              set -eu
              status=0
              for dir in components pages layouts service; do
                if [ -d "$dir" ]; then
                  go tool templ fmt -fail -prettier-required -log-level error "$dir" || status=1
                fi
              done
              if [ "$status" -ne 0 ]; then
                echo "templ fmt changed these files, commit them:" >&2
                git --no-pager diff --name-only -- '*.templ' >&2
                exit 1
              fi

    # Run all tests in all subdirectories
    test:
        cmds:
            - sqlite3 database/events.db ".schema --indent --nosys" > schema.sql
            - go test ./...

    # Run tests and print the BDD behavior report used in CI logs
    test:report:
        cmds:
            - go run ./cmd/testreport

    # Download local copies of remote assets
    download:
        cmds:
            - |
              echo "Specify an environment:"
              echo "  go tool task download:main"
              echo "  go tool task download:demo"
              exit 1

    download:main:
        cmds:
            - cmd: docker compose exec -e DB_SSH_USER={{.DB_SSH_USER}} webserver bash scripts/download-environment main all
              platforms: [windows]
            - cmd: bash scripts/download-environment main all
              platforms: [linux, darwin]

    download:main:db:
        cmds:
            - cmd: docker compose exec -e DB_SSH_USER={{.DB_SSH_USER}} webserver bash scripts/download-environment main db
              platforms: [windows]
            - cmd: bash scripts/download-environment main db
              platforms: [linux, darwin]

    download:main:images:
        cmds:
            - cmd: docker compose exec -e DB_SSH_USER={{.DB_SSH_USER}} webserver bash scripts/download-environment main images
              platforms: [windows]
            - cmd: bash scripts/download-environment main images
              platforms: [linux, darwin]

    download:demo:
        cmds:
            - cmd: docker compose exec -e DB_SSH_USER={{.DB_SSH_USER}} webserver bash scripts/download-environment demo all
              platforms: [windows]
            - cmd: bash scripts/download-environment demo all
              platforms: [linux, darwin]

    download:demo:db:
        cmds:
            - cmd: docker compose exec -e DB_SSH_USER={{.DB_SSH_USER}} webserver bash scripts/download-environment demo db
              platforms: [windows]
            - cmd: bash scripts/download-environment demo db
              platforms: [linux, darwin]

    download:demo:images:
        cmds:
            - cmd: docker compose exec -e DB_SSH_USER={{.DB_SSH_USER}} webserver bash scripts/download-environment demo images
              platforms: [windows]
            - cmd: bash scripts/download-environment demo images
              platforms: [linux, darwin]

    # Kill all running air, templ and taks processes
    kill:
        cmds:
            - killall -q main
            - killall -q templ
            - killall -q air
            - killall -q task

    # Makes the Codex skills in .agents/skills visible to Claude Code as well.
    # Run once per clone. Windows uses a junction so no admin rights are needed.
    setup:skills:
        desc: Link .agents/skills into .claude/skills so both tools read one copy
        cmds:
            - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/link-skills.ps1
              platforms: [windows]
            - cmd: ./scripts/link-skills.sh
              platforms: [linux, darwin]

    # Editors run their own templ binary and Prettier. templ's version comes from
    # go.mod, Prettier's from PRETTIER_VERSION, so the docs never name a version.
    setup:prettier:
        desc: Install the Prettier version CI uses for templ fmt
        cmds:
            - |
              if ! command -v npm >/dev/null 2>&1; then
                echo "npm not found. Install Node.js first, see README Quick Start." >&2
                exit 1
              fi
              npm install -g prettier@{{.PRETTIER_VERSION}}

    setup:editor:
        desc: Install the go.mod templ version and Prettier globally for the editor
        vars:
            TEMPL_VERSION:
                sh: v="$(go list -m github.com/a-h/templ)"; echo "${v##* }"
        cmds:
            - go install github.com/a-h/templ/cmd/templ@{{.TEMPL_VERSION}}
            - task: setup:prettier
            - task: check:editor

    check:editor:
        desc: Compare templ and Prettier on PATH with the versions the repo expects
        silent: true
        vars:
            TEMPL_VERSION:
                sh: v="$(go list -m github.com/a-h/templ)"; echo "${v##* }"
        cmds:
            - |
              set -eu
              have_templ="$(templ version 2>/dev/null || echo missing)"
              have_prettier="$(prettier --version 2>/dev/null || echo missing)"
              status=0
              if [ "$have_templ" = "{{.TEMPL_VERSION}}" ]; then
                echo "templ on PATH: $have_templ (matches go.mod)"
              else
                echo "templ on PATH: $have_templ, go.mod wants {{.TEMPL_VERSION}}. Run: go tool task setup:editor" >&2
                status=1
              fi
              if [ "$have_prettier" = "{{.PRETTIER_VERSION}}" ]; then
                echo "prettier on PATH: $have_prettier (matches CI)"
              else
                echo "prettier on PATH: $have_prettier, CI uses {{.PRETTIER_VERSION}}. Run: go tool task setup:prettier" >&2
                status=1
              fi
              exit $status
