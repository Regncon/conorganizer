name: golangci-lint
on:
    push:
        branches:
            - main
    pull_request:
        types: [opened, reopened, synchronize, ready_for_review]
        paths:
            - "**.go"
            - "**.mod"
            - "**.sum"
            - "**.templ"

permissions:
    contents: read

jobs:
    golangci:
        name: lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-go@v6
              id: setup-go
              with:
                  go-version: "1.27"
                  cache: false
            - name: Find Go cache directories
              id: go-cache-paths
              shell: bash
              run: |
                  echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
                  echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
            - name: Restore Go cache
              uses: actions/cache/restore@v5
              with:
                  path: |
                      ${{ steps.go-cache-paths.outputs.modules }}
                      ${{ steps.go-cache-paths.outputs.build }}
                  key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
                  restore-keys: |
                      go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-
            - name: Generate template files (templ via go.mod tool)
              run: go tool templ generate
            - name: golangci-lint
              uses: golangci/golangci-lint-action@v9
              with:
                  version: v2.13.2
