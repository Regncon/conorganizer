<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="1040" viewBox="0 0 1200 1040"
     role="img" aria-labelledby="map-title map-description" lang="nb">
  <title id="map-title">Grand Hotel Terminus – romkart for 7. etasje</title>
  <desc id="map-description">
    Forenklet kart basert på et foto av rømningsplanen. Etasjen er L-formet.
    Rom 707 ligger til venstre for den øvre korridoren. Rom 706 og 705 ligger
    til høyre. To heiser og et stort trapperom ligger ved korridorens knekk.
    Langs den nedre korridoren ligger rom 710, 711, 712 og 713 på undersiden,
    og rom 716 og 714 på oversiden. Trapper finnes også i hver ende.
    Rom 709, Kim Friele, ligger nederst til venstre.
    Romnavnene følger styrets bekreftede kobling mellom nummer og navn.
    WC ligger mellom rom 707 og 709. Trappene i hjørnene er nødutganger.
    Hele området mellom hovedtrappen og rom 714, samt rommet mellom 705 og heisene, er grået ut.
    Romstørrelser og døråpninger er forenklet. Kartet er ikke i målestokk.
  </desc>
  <metadata>
    Plassering og romnumre: brukerens foto, origin.webp.
    Romnavn og nummer for rom 709: mapping fra Regncons styre, oppgitt av brukeren.
    Stavemåten på romnavnene følger den oppgitte listen.
    WC og nødutganger er identifisert av brukeren.
    Rom 716 og rommet mellom 705 og heisene er antatt boder eller tekniske rom.
    Ubrukt nedre dør på rom 709 og ubrukt høyre dør på rom 714 er utelatt etter brukerens opplysninger.
    Dørblad og åpningsbuer er skjematiske; slagretning er ikke verifisert.
  </metadata>

