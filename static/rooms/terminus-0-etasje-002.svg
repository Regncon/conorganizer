  <title id="t0-002-title">Grand Hotel Terminus – Dorothe Engelbretsdatter, 0. etasje</title>
  <desc id="t0-002-desc">Kart til Dorothe Engelbretsdatter. To stiplede ruter viser veien fra heisene og trappen til rommet. Startpunktene er markert med blå sirkler, og målet er markert i blått.</desc>
  <metadata id="metadata1">Basert på brukerens skisse. Romnumrene er midlertidige, ikke hotellets bekreftede romnumre. To umerkede bokser er tolket som heiser. Dørslag er skjematiske og ikke verifisert. Åpningen øverst til høyre i rom 002 er bevart fra skissen; tilstøtende areal er ikke tegnet.</metadata>
