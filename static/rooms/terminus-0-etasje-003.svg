<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 70 1200 610" role="img" aria-labelledby="t0-003-title t0-003-desc" lang="nb">
<title id="t0-003-title">Grand Hotel Terminus – Søstrene Hagelin · 0. etasje</title>
<desc id="t0-003-desc">Kart over tre rom langs en felles gang. Foreløpige romnumre: 001 Inger Haldorsen, 002 Dorothe Engelbretsdatter, 003 Søstrene Hagelin. Trapp og antatte heiser på oversiden av gangen. Markert rom: Søstrene Hagelin.</desc>
<metadata>Basert på brukerens skisse. Romnumrene er midlertidige, ikke hotellets bekreftede romnumre. To umerkede bokser er tolket som heiser. Dørslag er skjematiske og ikke verifisert. Åpningen øverst til høyre i rom 002 er bevart fra skissen; tilstøtende areal er ikke tegnet.</metadata>
