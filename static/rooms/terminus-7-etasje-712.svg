<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="950" height="470" viewBox="0 110 950 470" role="img" aria-labelledby="room-712-map-title room-712-map-description" lang="nb">
  <title id="room-712-map-title">Amalie Skram – rom 712, Grand Hotel Terminus, 7. etasje</title>
  <desc id="room-712-map-description">Veien fra fellesområdet ved hovedtrappen og heisene til Amalie Skram, rom 712. Startpunktet er markert med en blå sirkel. Følg den stiplede linjen gjennom korridoren til pilen ved døren. Rommet har lys blå bakgrunn og en tydelig blå ramme. Kartets retning følger hovedkartet.</desc>
  <metadata>
    Plassering og romnumre: brukerens foto, origin.webp.
    Romnavn og nummer for rom 709: mapping fra Regncons styre, oppgitt av brukeren.
    Stavemåten på romnavnene følger den oppgitte listen.
    WC og nødutganger er identifisert av brukeren.
    Rom 716 og rommet mellom 705 og heisene er antatt boder eller tekniske rom.
    Ubrukt nedre dør på rom 709 og ubrukt høyre dør på rom 714 er utelatt etter brukerens opplysninger.
    Dørblad og åpningsbuer er skjematiske; slagretning er ikke verifisert.
  </metadata>
